name: Xiaohei delivery task / 小黑交付任务
description: Claim one ledger task with bounded scope, evidence, rollback, and gates / 领取一个带范围、证据、回滚和门禁的账本任务
title: "[TASK-ID] "
body:
  - type: markdown
    attributes:
      value: |
        Use one stable ID from the bilingual execution ledger. Read `STATUS.md`, both ledger mirrors, dependencies, and acceptance before starting.

        仅使用中英文执行账本中的一个稳定任务 ID。开工前须完整阅读 `STATUS.md`、两份账本镜像、依赖和验收要求。

  - type: input
    id: task_id
    attributes:
      label: Task ID / 任务 ID
      description: Exactly one stable ledger ID, for example CHAT-003 / 只填写一个稳定账本 ID
      placeholder: CHAT-003
    validations:
      required: true

  - type: dropdown
    id: state
    attributes:
      label: Claim state / 领取状态
      description: New implementation work may only claim a READY task / 新实现只能领取 READY 任务
      options:
        - READY — claim and move to IN_PROGRESS / 领取并转为进行中
        - VERIFY — independent verification only / 仅做独立验收
        - HUMAN — record a human or physical gate / 记录人工或物理门禁
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and source context / 依赖与来源上下文
      description: List dependency IDs, their evidence, and exact documents or code to read / 列出依赖 ID、已有证据及必须阅读的文档或代码
      placeholder: |
        Dependency IDs:
        Evidence already present:
        Required reading:
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Bounded scope / 有界范围
      description: State what changes and what remains out of scope / 明确本任务修改什么、不修改什么
      placeholder: |
        In scope:
        Out of scope:
        Files or components allowed:
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria / 验收标准
      description: Give observable pass and rejection cases; code existence is not device acceptance / 列出可观察的通过与拒绝用例；代码存在不等于真机验收
      placeholder: |
        Pass when:
        Reject when:
        Commands or device path:
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence and privacy boundary / 证据与隐私边界
      description: Define public evidence and private material that must never enter Git / 定义公开证据及绝不能进入 Git 的私密材料
      placeholder: |
        Public evidence:
        Private/raw evidence location:
        Claims that must remain VERIFY or HUMAN:
    validations:
      required: true

  - type: textarea
    id: rollback
    attributes:
      label: Rollback and cleanup / 回滚与清理
      description: Explain how to undo code and external state without broad destructive commands / 说明如何恢复代码和外部状态，禁止宽泛破坏性命令
      placeholder: |
        Code rollback:
        Device/service cleanup:
        Data recovery:
    validations:
      required: true

  - type: textarea
    id: human_gates
    attributes:
      label: Human, device, power, or offline-media gates / 人工、设备、功耗或离线介质门禁
      description: Write None only after checking the ledger; never replace a physical gate with a mock / 核对账本后方可写无；不得用模拟替代物理门禁
      placeholder: Gate, owner, required condition, and resume signal / 门禁、负责人、所需条件和恢复信号
    validations:
      required: true

  - type: textarea
    id: failure_fingerprint
    attributes:
      label: Failure fingerprint and retry budget / 失败指纹与重试预算
      description: Record the stop condition and what must change before one bounded retry / 记录停止条件，以及再次尝试前必须改变的条件
      placeholder: |
        Failure fingerprint:
        Retry limit:
        Resume only when:
    validations:
      required: true

  - type: checkboxes
    id: boundaries
    attributes:
      label: Delivery boundaries / 交付边界
      options:
        - label: I will update `STATUS.md` and both ledger mirrors in the same PR / 我会在同一 PR 更新状态页和两份账本镜像
          required: true
        - label: I will not commit `docs/articles/`, models, APKs, credentials, or private raw evidence / 我不会提交文章草稿、模型、APK、凭据或私密原始证据
          required: true
        - label: I will keep unmet device, human, power, and offline-media gates as VERIFY or HUMAN / 未完成的设备、人工、功耗和离线介质门禁保持 VERIFY 或 HUMAN
          required: true
